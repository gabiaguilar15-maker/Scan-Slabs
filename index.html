<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<title>Escáner de tablas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#14181c; --panel:#1d2329; --ink:#e7eaed; --muted:#9aa5b0; --line:#2e363e;
  --signal:#f2c230; --ok:#4cc27e; --warn:#e3a53a; --bad:#ef6b5c;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit}
/* --- cámara --- */
.cam{position:relative;flex:0 0 auto;height:46vh;min-height:240px;background:#000;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:8%;right:8%;top:22%;bottom:22%;border:3px solid var(--signal);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);transition:border-color .15s}
.frame::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--bad);opacity:.8;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-35px)}to{transform:translateY(35px)}}
@media (prefers-reduced-motion:reduce){.frame::after{animation:none}}
.cam.flash-ok .frame{border-color:var(--ok)} .cam.flash-dup .frame{border-color:var(--warn)}
.camtop{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px}
.chip{background:rgba(20,24,28,.78);color:var(--ink);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--signal);color:#14181c;border-color:var(--signal)}
.camover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:#0d1013}
.camover p{margin:0;color:var(--muted);max-width:30ch}
.big-btn{background:var(--signal);color:#14181c;border:0;border-radius:10px;padding:16px 26px;font-family:var(--f-display);font-weight:700;font-size:1.6rem;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border-radius:8px;padding:8px 14px;font-family:var(--f-mono);font-weight:600;font-size:1.1rem;white-space:nowrap;border:2px solid var(--ok)}
.toast.dup{border-color:var(--warn)}
.toast small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* --- panel --- */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:10px}
.top select{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:16px}
.count{text-align:right;line-height:1}
.count b{display:block;font-family:var(--f-display);font-size:2.3rem;font-variant-numeric:tabular-nums}
.count span{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.x:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
form.manual{display:flex;gap:8px}
form.manual input{flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:16px}
ol{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:80px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px}
li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .n{flex:1;min-width:0;font-family:var(--f-mono);font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
li .meta{font-size:.72rem;color:var(--muted);text-align:right}
li.new{animation:hl 1.4s ease-out}
@keyframes hl{from{background:#1f4a31}to{background:transparent}}
.x{background:none;border:0;color:var(--muted);padding:8px;cursor:pointer;border-radius:4px;font-size:.85rem}
li.confirm{background:#3a1c18}
.empty{padding:18px;text-align:center;color:var(--muted)}
.msg{font-size:.85rem;color:var(--muted);min-height:1.2em}
dialog{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-family:var(--f-display);text-transform:uppercase;margin:0 0 8px;font-size:1.3rem}
dialog input{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:16px;margin:8px 0}
dialog .row{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<section class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame"></div>
  <div class="camtop">
    <button class="chip" id="pauseBtn" type="button" aria-pressed="false">Pausar</button>
    <button class="chip" id="torchBtn" type="button" aria-pressed="false" hidden>Linterna</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="camover" id="camOver">
    <button class="big-btn" id="startBtn" type="button">Empezar a escanear</button>
    <p id="camMsg">Apunta al código de barras de la etiqueta. Lee solo, sin pulsar nada: verde = nueva, ámbar = ya estaba.</p>
    <p style="font-size:.7rem;opacity:.6">versión 3</p>  </div>
</section>

<section class="panel">
  <div class="top">
    <select id="recSel" aria-label="Recuento"></select>
    <div class="count"><b id="count">0</b><span>tablas</span></div>
  </div>
  <div class="actions">
    <span class="btn">Hacer foto<input type="file" id="photoIn" accept="image/*" capture="environment" aria-label="Hacer foto de la etiqueta"></span>
    <button class="btn" id="newRecBtn" type="button">Nuevo recuento</button>
    <span class="btn">Importar Excel<input type="file" id="importIn" accept=".xlsx,.xls,.csv" aria-label="Importar Excel"></span>
    <button class="btn primary" id="xlsxBtn" type="button">Exportar Excel</button>
  </div>
  <form class="manual" id="manualForm" autocomplete="off">
    <input id="manual" inputmode="numeric" placeholder="Escribir nº a mano" aria-label="Número de tabla a mano">
    <button class="btn" type="submit" style="flex:0 0 auto">Añadir</button>
  </form>
  <div class="msg" id="msg"></div>
  <pre id="diag" style="margin:0;font-size:.72rem;color:var(--muted);white-space:pre-wrap;font-family:var(--f-mono)"></pre>
  <ol id="list"></ol>
</section>

<dialog id="recDlg">
  <form method="dialog" id="recForm">
    <h3>Nuevo recuento</h3>
    <label for="recName">Nombre (almacén, fecha…)</label>
    <input id="recName" required>
    <div class="row"><button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button><button class="btn primary" value="ok" type="submit">Crear</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const VALID = /^0?2\d{10,11}$/;   // 220250163749 · antiguas 022017061199 / 22016767370
  const KEY = "escaner-tablas-v1";

  // ---------- almacenamiento local ----------
  let DB = { recuentos: [], tablas: [], actual: "" };
  try { DB = Object.assign(DB, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch { flashMsg("No se pudo guardar en el móvil: revisa el espacio libre.", true); } };
  if (!DB.recuentos.length) {
    const d = new Date(); DB.recuentos = ["Recuento " + String(d.getDate()).padStart(2,"0") + "-" + String(d.getMonth()+1).padStart(2,"0")];
  }
  if (!DB.recuentos.includes(DB.actual)) DB.actual = DB.recuentos[DB.recuentos.length - 1];
  save();
  try { navigator.storage?.persist?.(); } catch {}

  const current = () => DB.tablas.filter(t => t.recuento === DB.actual);
  const has = serie => DB.tablas.some(t => t.recuento === DB.actual && t.serie === serie);
  let newSerie = null, confirmSerie = null;

  function add(serie, metodo) {
    if (has(serie)) return false;
    DB.tablas.push({ serie, recuento: DB.actual, metodo, ts: new Date().toISOString() });
    save(); newSerie = serie; return true;
  }

  // ---------- UI ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function render() {
    $("recSel").innerHTML = DB.recuentos.map(r => `<option ${r === DB.actual ? "selected" : ""}>${esc(r)}</option>`).join("");
    const list = current().slice().reverse();
    $("count").textContent = list.length;
    if (!list.length) { $("list").innerHTML = `<li class="empty">Sin tablas en este recuento. Pulsa «Empezar a escanear» y apunta a una etiqueta.</li>`; return; }
    $("list").innerHTML = list.map(t => {
      const h = new Date(t.ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      if (t.serie === confirmSerie) return `<li class="confirm" data-s="${esc(t.serie)}"><span class="n">${esc(t.serie)}</span><button class="x" data-a="yes" style="color:var(--bad);font-weight:600">Quitar</button><button class="x" data-a="no">Cancelar</button></li>`;
      return `<li data-s="${esc(t.serie)}" class="${t.serie === newSerie ? "new" : ""}"><span class="n">${esc(t.serie)}</span><span class="meta">${h}<br>${t.metodo === "Escrito a mano" ? "a mano" : t.metodo === "Importado" ? "importada" : "escaneada"}</span><button class="x" data-a="ask" aria-label="Quitar ${esc(t.serie)}">✕</button></li>`;
    }).join("");
    newSerie = null;
  }
  $("list").addEventListener("click", e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const s = b.closest("li").dataset.s;
    if (b.dataset.a === "ask") confirmSerie = s;
    else if (b.dataset.a === "no") confirmSerie = null;
    else { DB.tablas = DB.tablas.filter(t => !(t.recuento === DB.actual && t.serie === s)); confirmSerie = null; save(); }
    render();
  });
  $("recSel").addEventListener("change", e => { DB.actual = e.target.value; save(); render(); });
  $("newRecBtn").addEventListener("click", () => { $("recName").value = ""; $("recDlg").showModal(); });
  $("recDlg").addEventListener("close", () => {
    const v = $("recName").value.trim();
    if ($("recDlg").returnValue === "ok" && v) { if (!DB.recuentos.includes(v)) DB.recuentos.push(v); DB.actual = v; save(); render(); }
  });
  let msgT;
  function flashMsg(t, bad) { $("msg").textContent = t; $("msg").style.color = bad ? "var(--bad)" : "var(--muted)"; clearTimeout(msgT); msgT = setTimeout(() => $("msg").textContent = "", 5000); }

  $("manualForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("manual").value.replace(/\D/g, "");
    if (!VALID.test(v)) { flashMsg("Un nº de tabla tiene 12 cifras y empieza por 2 (ej. 220250163749).", true); return; }
    flashMsg(add(v, "Escrito a mano") ? `Añadida ${v}` : `${v} ya estaba en el recuento`);
    $("manual").value = ""; render();
  });

  // ---------- Excel ----------
  $("xlsxBtn").addEventListener("click", () => {
    const rows = current();
    if (!rows.length) { flashMsg("No hay tablas que exportar en este recuento."); return; }
    if (!window.XLSX) { flashMsg("Falta conexión para generar el Excel la primera vez. Conéctate y prueba otra vez.", true); return; }
    const aoa = [["Nº tabla", "Recuento", "Fecha y hora", "Cómo se leyó"]];
    rows.forEach(t => aoa.push([{ t: "s", v: t.serie }, t.recuento, new Date(t.ts).toLocaleString("es-ES"), t.metodo]));
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws["!cols"] = [{wch:16},{wch:22},{wch:20},{wch:18}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tablas");
    XLSX.writeFile(wb, "Tablas_" + DB.actual.replace(/[^\w\-]+/g, "_") + ".xlsx");
  });
  $("importIn").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !window.XLSX) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      let n = 0, dup = 0;
      wb.SheetNames.slice(0, 1).forEach(sn => {
        XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false }).forEach(row => {
          const v = String(row[0] ?? "").replace(/\D/g, "");
          if (VALID.test(v)) { add(v, "Importado") ? n++ : dup++; }
        });
      });
      flashMsg(`Importadas ${n} tablas en «${DB.actual}»${dup ? ` (${dup} ya estaban)` : ""}.`);
      render();
    } catch { flashMsg("No se pudo leer ese archivo. Usa un Excel con los números en la primera columna.", true); }
  });

  // ---------- feedback ----------
  let actx = null;
  function beep(ok) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const play = (f, t0, d) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "square"; g.gain.value = .06; o.connect(g).connect(actx.destination); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + d); };
      ok ? play(1760, 0, .09) : (play(520, 0, .07), play(520, .12, .07));
    } catch {}
    try { navigator.vibrate?.(ok ? 70 : [30, 50, 30]); } catch {}
  }
  let toastT;
  function show(serie, ok) {
    const c = $("cam"); c.classList.remove("flash-ok", "flash-dup"); c.classList.add(ok ? "flash-ok" : "flash-dup");
    const t = $("toast"); t.hidden = false; t.className = "toast" + (ok ? "" : " dup");
    t.innerHTML = `<small>${ok ? "Nueva" : "Ya estaba"}</small>${esc(serie)}`;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; c.classList.remove("flash-ok", "flash-dup"); }, 1400);
    beep(ok);
  }

  // ---------- escaneo continuo ----------
  const video = $("video");
  let stream = null, track = null, running = false, paused = false, native = null, zx = null;
  const lastSeen = new Map();   // serie -> ms; evita repetir el aviso mientras la etiqueta sigue delante

  async function setupDecoders() {
    try {
      if ("BarcodeDetector" in window) {
        const sup = await BarcodeDetector.getSupportedFormats();
        const f = ["code_128", "itf", "code_39", "ean_13"].filter(x => sup.includes(x));
        if (f.length) native = new BarcodeDetector({ formats: f });
      }
    } catch {}
    if (!native && window.ZXing) {
      const Z = window.ZXing, hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.ITF, Z.BarcodeFormat.CODE_39]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      zx = new Z.MultiFormatReader(); zx.setHints(hints);
    }
  }

  const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
  let tick = 0;
  function cropToCanvas(rot) {
    // recorta la zona del marco (centro del vídeo) y opcionalmente la gira 90°
    const vw = video.videoWidth, vh = video.videoHeight;
    const sw = vw * .84, sh = vh * .56, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    const k = Math.min(1, 1280 / Math.max(sw, sh));
    const w = Math.round(sw * k), h = Math.round(sh * k);
    if (rot) { cv.width = h; cv.height = w; ctx.save(); ctx.translate(h, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h); ctx.restore(); }
    else { cv.width = w; cv.height = h; ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h); }
    return cv;
  }
  async function readFrame() {
    if (native) {
      const r = await native.detect(video);
      return r.map(b => b.rawValue);
    }
    if (zx) {
      const Z = window.ZXing;
      const c = cropToCanvas((tick++ % 2) === 1);    // alterna horizontal / vertical
      try {
        const bb = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
        const t = zx.decode(bb).getText(); zx.reset(); return [t];
      } catch { try { zx.reset(); } catch {} return []; }
    }
    return [];
  }
  async function loop() {
    if (!running) return;
    if (!paused && video.readyState >= 2) {
      try {
        const now = Date.now();
        for (const raw of await readFrame()) {
          const v = String(raw).replace(/\D/g, "");
          if (!VALID.test(v)) continue;
          const last = lastSeen.get(v) || 0; lastSeen.set(v, now);
          if (now - last < 2500) continue;
          const ok = add(v, "Escaneada");
          show(v, ok); if (ok) render();
        }
      } catch {}
    }
    setTimeout(() => requestAnimationFrame(loop), native ? 120 : 60);
  }

  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ name: "Timeout" }), ms))]);
  async function getStream() {
    const tries = [
      { audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      { audio: false, video: { facingMode: "environment" } },
      { audio: false, video: true }
    ];
    let last;
    for (const c of tries) {
      try { return await withTimeout(navigator.mediaDevices.getUserMedia(c), 12000); }
      catch (e) { last = e; if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) throw e; }
    }
    throw last;
  }
  const inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|GSA\//i.test(navigator.userAgent);
  if (inApp) $("camMsg").textContent = "Parece que has abierto el enlace desde otra app (WhatsApp, Gmail…). Si la cámara no arranca, ábrelo en Chrome (Android) o Safari (iPhone).";

  const diag = [];
  function log(t) { diag.push(t); $("diag").textContent = diag.join("\n"); }

  async function start() {
    $("startBtn").disabled = true; diag.length = 0;
    $("camMsg").textContent = "Abriendo cámara… Si sale un aviso de permiso, pulsa «Permitir».";
    log("1. Pidiendo cámara…");
    if (!navigator.mediaDevices?.getUserMedia) { log("✗ Este navegador no permite cámara"); $("camMsg").textContent = "Este navegador no da acceso a la cámara. Abre la página con Chrome (Android) o Safari (iPhone)."; $("startBtn").disabled = false; return; }
    try {
      stream = await getStream();
    } catch (e) {
      log("✗ Cámara: " + (e?.name || e));
      $("startBtn").disabled = false;
      $("camMsg").textContent =
        e && e.name === "NotAllowedError" ? "Permiso de cámara denegado. Toca el candado junto a la dirección > Permisos > Cámara > Permitir, y recarga." :
        e && e.name === "Timeout" ? "La cámara no responde. Cierra otras apps que usen la cámara, comprueba el permiso (candado junto a la dirección) y, si abriste el enlace desde WhatsApp o Gmail, ábrelo en Chrome o Safari." :
        e && e.name === "NotReadableError" ? "Otra app está usando la cámara. Ciérrala y vuelve a intentarlo." :
        "No se pudo abrir la cámara (" + (e?.name || "error") + "). Prueba en Chrome (Android) o Safari (iPhone).";
      return;
    }
    track = stream.getVideoTracks()[0];
    log("2. Cámara abierta: " + (track?.label || "sin nombre"));
    video.muted = true; video.setAttribute("playsinline", ""); video.setAttribute("autoplay", "");
    video.srcObject = stream;
    $("camOver").hidden = true;                       // se ve la imagen aunque lo demás tarde
    video.play().then(() => log("3. Vídeo en marcha"), e => log("✗ Vídeo: " + (e?.name || e)));
    withTimeout(track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }), 2000).catch(() => {});
    try { if (track.getCapabilities?.().torch) $("torchBtn").hidden = false; } catch {}
    try { await withTimeout(setupDecoders(), 4000); } catch { log("✗ Lector: tardó demasiado"); }
    log("4. Lector: " + (native ? "del móvil" : zx ? "ZXing" : "NINGUNO"));
    if (!native && !zx) {
      $("camOver").hidden = false; $("startBtn").disabled = false;
      $("camMsg").textContent = "No se pudo cargar el lector de códigos. Comprueba que tienes internet y recarga la página.";
      return;
    }
    navigator.wakeLock?.request("screen").catch(() => {});
    beep(true);
    running = true; loop();
    log("5. Escaneando");
  }

  // ---------- modo foto (plan B) ----------
  async function decodeFile(file) {
    if (!native && !zx) await withTimeout(setupDecoders(), 4000).catch(() => {});
    const bmp = await createImageBitmap(file);
    const found = new Set();
    if (native) { try { (await native.detect(bmp)).forEach(b => found.add(b.rawValue)); } catch {} }
    if (!found.size && zx) {
      const Z = window.ZXing, c = document.createElement("canvas"), x = c.getContext("2d");
      for (const max of [1600, 1100]) for (const rot of [0, 1]) {
        const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
        if (rot) { c.width = h; c.height = w; x.save(); x.translate(h, 0); x.rotate(Math.PI / 2); x.drawImage(bmp, 0, 0, w, h); x.restore(); }
        else { c.width = w; c.height = h; x.drawImage(bmp, 0, 0, w, h); }
        try { found.add(zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()); zx.reset(); break; }
        catch { try { zx.reset(); } catch {} }
      }
    }
    return [...found].map(v => String(v).replace(/\D/g, "")).filter(v => VALID.test(v));
  }
  $("photoIn").addEventListener("change", async e => {
    const files = [...e.target.files]; e.target.value = "";
    let n = 0, dup = 0, bad = 0;
    for (const f of files) {
      flashMsg("Leyendo foto…");
      let codes = []; try { codes = await decodeFile(f); } catch {}
      if (!codes.length) { bad++; continue; }
      for (const v of codes) { const ok = add(v, "Escaneada"); ok ? n++ : dup++; if (files.length === 1) show(v, ok); }
    }
    flashMsg(bad && !n && !dup ? "No se lee el código. Repite la foto más cerca y sin mover." : `${n} añadidas · ${dup} ya estaban${bad ? ` · ${bad} sin leer` : ""}`, bad && !n);
    render();
  });
  $("startBtn").addEventListener("click", start);
  $("pauseBtn").addEventListener("click", () => {
    paused = !paused; $("pauseBtn").setAttribute("aria-pressed", paused); $("pauseBtn").textContent = paused ? "Reanudar" : "Pausar";
  });
  $("torchBtn").addEventListener("click", async () => {
    const on = $("torchBtn").getAttribute("aria-pressed") !== "true";
    try { await track.applyConstraints({ advanced: [{ torch: on }] }); $("torchBtn").setAttribute("aria-pressed", on); } catch {}
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) navigator.wakeLock?.request("screen").catch(() => {});
  });

  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
